    else{
      mtx.innerHTML=`<table class="dd-table"><tr><th>HH</th>${PCA_ATTRS.map(a=>`<th title="${a}">${a.slice(0,3)}</th>`).join("")}</tr>${
        pcaData.map(r=>`<tr><td>${r.label}</td>${r.v.map(x=>`<td>${x?"✔":"·"}</td>`).join("")}</tr>`).join("")}</table>`;
    }
  }
  const steps=document.getElementById("pca-steps");
  if(!steps) return;
  const m=pcaData.length, p=PCA_ATTRS.length;
  if(m<3){ steps.innerHTML="<p class='tool-warn'>Add at least 3 households to run PCA.</p>"; return; }
  const X=pcaData.map(r=>r.v);
  // ---- Step: standardise (drop assets everyone/no-one owns: SD=0) ----
  const means=[],sds=[],constCols=[];
  for(let j=0;j<p;j++){const col=X.map(r=>r[j]);const mu=col.reduce((a,b)=>a+b,0)/m;
    const v=col.reduce((a,b)=>a+(b-mu)**2,0)/(m-1);means.push(mu);
    const sdv=Math.sqrt(v);sds.push(sdv);if(sdv<1e-9)constCols.push(j);}
  const Z=X.map(r=>r.map((x,j)=>sds[j]<1e-9?0:(x-means[j])/sds[j]));
  // ---- Step: covariance ----
  const C=Array.from({length:p},()=>Array(p).fill(0));
  for(let a=0;a<p;a++)for(let b=0;b<p;b++){let s=0;for(let i=0;i<m;i++)s+=Z[i][a]*Z[i][b];C[a][b]=s/(m-1);}
  // ---- Step: eigen ----
  const {values,vectors}=jacobiEigen(C);
  const order=values.map((v,i)=>[v,i]).sort((x,y)=>y[0]-x[0]);
  const eig=order.map(o=>Math.max(o[0],0)), vec=order.map(o=>vectors.map(row=>row[o[1]]));
  const total=eig.reduce((a,b)=>a+b,0)||1;
  const varExp=eig.map(e=>e/total*100);
  const cum=[]; let run=0; varExp.forEach(v=>{run+=v;cum.push(run);});
  // Orient PC1 so that owning MORE assets => higher score (wealth direction).
  // If the sum of PC1 loadings is negative, flip PC1.
  const loadSum=vec[0].reduce((a,b)=>a+b,0);
  if(loadSum<0){ vec[0]=vec[0].map(x=>-x); }
  // scores (PC1 = wealth index, PC2)
  const scores=Z.map(z=>[0,1].map(k=>z.reduce((s,zv,j)=>s+zv*vec[k][j],0)));
  // wealth ranking by PC1
  const ranked=pcaData.map((r,i)=>({label:r.label,pc1:scores[i][0],owns:r.v.reduce((a,b)=>a+b,0)}))
    .sort((a,b)=>a.pc1-b.pc1);
  const pc1min=Math.min(...ranked.map(r=>r.pc1)),pc1max=Math.max(...ranked.map(r=>r.pc1));
  const range=(pc1max-pc1min)||1;
  // poverty cutoff: bottom 40% of the wealth score (a common relative-poverty style cut)
  const cutIdx=Math.floor(ranked.length*0.4);
  const cutScore=ranked[Math.max(0,cutIdx-1)]?ranked[Math.max(0,cutIdx-1)].pc1:pc1min;
  // strongest off-diagonal covariance pair
  let best=[0,1,0]; for(let a=0;a<p;a++)for(let b=a+1;b<p;b++){if(Math.abs(C[a][b])>Math.abs(best[2]))best=[a,b,C[a][b]];}
  const cov2col=v=>{const t=Math.max(-1,Math.min(1,v));
    return t>=0?`rgba(34,197,94,${0.12+0.5*t})`:`rgba(239,68,68,${0.12+0.5*-t})`;};
  const zcol=v=>v>=0?"#2563eb":"#dc2626";
  // PC1 loadings table (which assets signal wealth)
  const loadRank=PCA_ATTRS.map((a,j)=>({a,load:vec[0][j]})).sort((x,y)=>y.load-x.load);
  steps.innerHTML=`
    ${constCols.length?`<div class="pca-warn-note">Note: ${constCols.map(j=>PCA_ATTRS[j]).join(", ")} — every household is the same on ${constCols.length>1?"these":"this"}, so ${constCols.length>1?"they carry":"it carries"} no information and ${constCols.length>1?"are":"is"} ignored.</div>`:""}
    <div class="pca-step"><span class="pca-badge">Step 2</span><h3 class="pca-h">Standardisation (Z-score)</h3>
      <p class="pca-note">PCA is scale-sensitive, so each asset column is centred at 0 and divided by its SD. <code>Z = (X − mean)/SD</code>. A positive Z means the household owns an asset that is relatively rare (a wealth signal).</p>
      <div class="pca-scroll"><table class="dd-table"><tr><th>HH</th>${PCA_ATTRS.map(a=>`<th title="${a}">${a.slice(0,3)}</th>`).join("")}</tr>${
        Z.slice(0,6).map((z,i)=>`<tr><td>${pcaData[i].label}</td>${z.map(v=>`<td style="color:${zcol(v)}">${fmt(v)}</td>`).join("")}</tr>`).join("")}
        ${Z.length>6?`<tr><td>…</td>${PCA_ATTRS.map(()=>"<td>…</td>").join("")}</tr>`:""}</table></div>
    </div>
    <div class="pca-step"><span class="pca-badge">Step 3</span><h3 class="pca-h">Covariance matrix</h3>
      <p class="pca-note">How often assets are owned together. Assets that co-occur (e.g. car &amp; washing machine) are green; those that rarely go together are red. <code>Cov = (Zᵀ·Z)/(n−1)</code>.</p>
      <div class="pca-scroll"><table class="pca-heat"><tr><th></th>${PCA_ATTRS.map(a=>`<th>${a.slice(0,3)}</th>`).join("")}</tr>${
        C.map((row,a)=>`<tr><th>${PCA_ATTRS[a].slice(0,3)}</th>${row.map(v=>`<td style="background:${cov2col(v)}">${fmt(v)}</td>`).join("")}</tr>`).join("")}</table></div>
      <p class="pca-hl">Assets most often owned together: <b>${PCA_ATTRS[best[0]]} &amp; ${PCA_ATTRS[best[1]]}</b> (covariance ${fmt(best[2])}).</p>
    </div>
    <div class="pca-step"><span class="pca-badge">Step 4</span><h3 class="pca-h">Eigenvalues — how much each component explains</h3>
      <p class="pca-note">PC1 captures the biggest shared pattern across all assets — which turns out to be overall wealth. It explains <b>${varExp[0].toFixed(1)}%</b> of the variation. Each later PC captures the biggest <i>leftover</i> pattern the earlier ones missed, so they always explain less.</p>
      <div class="pca-bars">${varExp.map((v,i)=>`
        <div class="pca-bar-row"><span class="pca-bar-lab">PC${i+1}</span>
          <div class="pca-bar-track"><div class="pca-bar-fill" style="width:${v.toFixed(1)}%">${v.toFixed(1)}%</div></div>
          <span class="pca-bar-val">${fmt(eig[i])}</span></div>`).join("")}</div>
      <p class="pca-hl">When to stop: keep PCs until you reach ~80–90% cumulative, or until an eigenvalue drops below 1 (below 1 means that PC explains less than one original asset). Here ${(()=>{const keep=eig.filter(e=>e>=1).length||1;const cumk=cum[keep-1];return `<b>${keep} component${keep>1?"s":""}</b> have eigenvalue ≥ 1, together explaining ${cumk.toFixed(0)}%`;})()}.</p>
    </div>
    <div class="pca-step"><span class="pca-badge">Step 5</span><h3 class="pca-h">What PC1 means (the wealth signal)</h3>
      <p class="pca-note">PC1's loadings show which assets most define wealth here. Assets with the biggest positive weight are the strongest markers of a better-off household.</p>
      <div class="pca-scroll"><table class="dd-table"><tr><th>Asset</th><th>PC1 weight</th><th>Signal</th></tr>${
        loadRank.map(r=>`<tr><td>${r.a}</td><td>${fmt(r.load,3)}</td><td>${r.load>0.25?"strong wealth marker":r.load>0.05?"mild wealth marker":r.load<-0.05?"poverty marker":"neutral"}</td></tr>`).join("")}</table></div>
    </div>
    <div class="pca-step"><span class="pca-badge">Step 6</span><h3 class="pca-h">Wealth Index — ranking households (poorest → richest)</h3>
      <p class="pca-note">Each household's PC1 score is its <b>wealth index</b>. Bars grow from poorest (left/red) to richest (green). The dashed idea: the bottom ~40% by score are flagged as the <b>poorest / likely poor</b>.</p>
      <div class="wealth-list">${ranked.map((r,i)=>{
        const pct=((r.pc1-pc1min)/range)*100;
        const poor=i<cutIdx;
        return `<div class="wealth-row">
          <span class="wealth-lab">${r.label}</span>
          <div class="wealth-track"><div class="wealth-fill ${poor?"poor":"ok"}" style="width:${Math.max(4,pct).toFixed(0)}%"></div></div>
          <span class="wealth-score">${fmt(r.pc1)} ${poor?"🔴":"🟢"}</span></div>`;}).join("")}
      </div>
      <p class="pca-hl">🔴 Poorest ${cutIdx} household(s) flagged as likely poor · 🟢 the rest are relatively better-off. Owning more high-value assets pushes a household to the right.</p>
    </div>
    <div class="pca-step"><span class="pca-badge">Step 7</span><h3 class="pca-h">Biplot — households &amp; assets together</h3>
      <p class="pca-note"><b>Dots</b> = households. <b>Arrows</b> = assets. Households on the same side as an asset's arrow tend to own it. PC1 (${varExp[0].toFixed(1)}%) is the wealth axis.</p>
      <div class="chart-wrap" style="height:320px"><canvas id="pca-biplot"></canvas></div>
    </div>
    ${decBox(
      varExp[0]>=50 ? `PC1 explains ${varExp[0].toFixed(0)}% of the variation — a strong single 'wealth' dimension. <b>Use the PC1 score as the household wealth index</b> and treat the flagged bottom ${cutIdx} as the poorest for targeting aid or subsidies. This is exactly how asset-based poverty indices (e.g. DHS Wealth Index) work when income data is unreliable.`
      : `PC1 explains only ${varExp[0].toFixed(0)}% — the assets don't line up neatly into one wealth axis (maybe too few households, or assets that don't track wealth). Add more households or more wealth-relevant assets before trusting the index for targeting.`)}`;
  // biplot
  if(pcaCharts.biplot) pcaCharts.biplot.destroy();
  const maxScore=Math.max(1,...scores.map(s=>Math.max(Math.abs(s[0]),Math.abs(s[1]))));
  const arrowScale=maxScore*0.9;
  const arrowData=PCA_ATTRS.map((a,j)=>({x:vec[0][j]*arrowScale,y:vec[1][j]*arrowScale,label:a}));
  pcaCharts.biplot=new Chart(document.getElementById("pca-biplot").getContext("2d"),{
    type:"scatter",
    data:{datasets:[
      {label:"observations",data:scores.map((s,i)=>({x:s[0],y:s[1],label:pcaData[i].label})),
        backgroundColor:"#4f46e5",pointRadius:5},
      {label:"attributes",data:arrowData,backgroundColor:"#dc2626",pointRadius:0}
    ]},
    options:{plugins:{legend:{position:"bottom"},
      tooltip:{callbacks:{label:(c)=>c.raw.label||`(${fmt(c.raw.x)}, ${fmt(c.raw.y)})`}}},
      scales:{x:{title:{display:true,text:`PC1 (${varExp[0].toFixed(0)}%)`}},
              y:{title:{display:true,text:`PC2 (${varExp[1].toFixed(0)}%)`}}}},
    plugins:[{id:"arrows",afterDatasetsDraw(chart){
      const {ctx,scales}=chart; ctx.save();
      arrowData.forEach(a=>{
        const x0=scales.x.getPixelForValue(0),y0=scales.y.getPixelForValue(0);
        const x1=scales.x.getPixelForValue(a.x),y1=scales.y.getPixelForValue(a.y);
        ctx.strokeStyle="#dc2626";ctx.fillStyle="#111";ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
        // arrowhead
        const ang=Math.atan2(y1-y0,x1-x0);
        ctx.beginPath();ctx.moveTo(x1,y1);
        ctx.lineTo(x1-8*Math.cos(ang-0.4),y1-8*Math.sin(ang-0.4));
        ctx.lineTo(x1-8*Math.cos(ang+0.4),y1-8*Math.sin(ang+0.4));
        ctx.closePath();ctx.fillStyle="#dc2626";ctx.fill();
        ctx.fillStyle="#111";ctx.font="bold 11px sans-serif";
        ctx.fillText(a.label,x1+4,y1-4);
      });
      ctx.restore();
    }}]
  });
}
// Jacobi eigenvalue algorithm for a symmetric matrix
function jacobiEigen(A){
  const n=A.length; let a=A.map(r=>r.slice());
  let V=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));
  for(let iter=0;iter<100;iter++){
    let p=0,q=1,max=0;
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){if(Math.abs(a[i][j])>max){max=Math.abs(a[i][j]);p=i;q=j;}}
    if(max<1e-9)break;
    const app=a[p][p],aqq=a[q][q],apq=a[p][q];
    const phi=0.5*Math.atan2(2*apq,aqq-app);
    const c=Math.cos(phi),s=Math.sin(phi);
    for(let i=0;i<n;i++){const aip=a[i][p],aiq=a[i][q];a[i][p]=c*aip-s*aiq;a[i][q]=s*aip+c*aiq;}
    for(let i=0;i<n;i++){const api=a[p][i],aqi=a[q][i];a[p][i]=c*api-s*aqi;a[q][i]=s*api+c*aqi;}
    for(let i=0;i<n;i++){const vip=V[i][p],viq=V[i][q];V[i][p]=c*vip-s*viq;V[i][q]=s*vip+c*viq;}
  }
  return {values:a.map((r,i)=>r[i]),vectors:V};
}

function checkQuiz(){
  const items = document.querySelectorAll(".quiz-item");
  let correct=0;
  items.forEach(item=>{
    const ans=parseInt(item.dataset.answer,10);
    const chosen=item.querySelector("input:checked");
    const fb=item.querySelector(".feedback");
    if(!chosen){fb.textContent="⚠️ Please select an answer.";fb.className="feedback warn";return;}
    if(parseInt(chosen.value,10)===ans){fb.textContent="✅ Correct!";fb.className="feedback ok";correct++;}
    else{fb.textContent="❌ Not quite — review the theory above.";fb.className="feedback bad";}
  });
  const s=document.getElementById("score");
  s.textContent=`You scored ${correct} / ${items.length}`;
  s.className="score "+(correct===items.length?"ok":"");
}

function drawEconChart(id, ch){
  const el=document.getElementById(id); if(!el) return;
  const ctx=el.getContext("2d");
  if(econCharts[id]) econCharts[id].destroy();
  const BLUE="#2563eb", GREY="#94a3b8", RED="#ef4444", GREEN="#16a34a", PURPLE="#7c3aed";
  let cfg;
  if(ch.type==="line"){
    cfg={type:"line",data:{labels:ch.labels,datasets:[{label:ch.ylabel,data:ch.data,borderColor:BLUE,backgroundColor:"rgba(37,99,235,.1)",tension:.3,fill:true,pointRadius:3}]},
      options:{plugins:{legend:{display:false}},scales:{y:{title:{display:true,text:ch.ylabel}}}}};
  } else if(ch.type==="line2"){
    cfg={type:"line",data:{labels:ch.labels,datasets:[
      {label:ch.series[0],data:ch.data,borderColor:BLUE,tension:.2,pointRadius:3,fill:false},
      {label:ch.series[1],data:ch.data2,borderColor:GREY,borderDash:[6,4],tension:0,pointRadius:0,fill:false}]},
      options:{plugins:{legend:{position:"bottom"}},scales:{y:{title:{display:true,text:ch.ylabel}}}}};
  } else if(ch.type==="bar"){
    const cols=ch.stacked?[GREY,BLUE,GREEN]:ch.labels.map((_,k)=>[BLUE,GREY,GREEN,RED][k%4]);
    cfg={type:"bar",data:{labels:ch.labels,datasets:[{label:ch.ylabel,data:ch.data,backgroundColor:cols}]},
      options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,title:{display:true,text:ch.ylabel}}}}};
  } else if(ch.type==="doughnut"){
    cfg={type:"doughnut",data:{labels:ch.labels,datasets:[{data:ch.data,backgroundColor:[GREEN,RED]}]},
      options:{plugins:{legend:{position:"bottom"}}}};
  } else if(ch.type==="scatter"){
    cfg={type:"scatter",data:{datasets:[{label:"data",data:ch.points.map(p=>({x:p[0],y:p[1]})),backgroundColor:BLUE,pointRadius:5}]},
      options:{plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:ch.xlabel}},y:{title:{display:true,text:ch.ylabel}}}}};
  } else if(ch.type==="regression"){
    const xs=ch.points.map(p=>p[0]),xmn=Math.min(...xs),xmx=Math.max(...xs);
    cfg={data:{datasets:[
      {type:"scatter",label:"data",data:ch.points.map(p=>({x:p[0],y:p[1]})),backgroundColor:BLUE,pointRadius:5},
      {type:"line",label:"fit",data:[{x:xmn,y:ch.intercept+ch.slope*xmn},{x:xmx,y:ch.intercept+ch.slope*xmx}],borderColor:RED,borderWidth:2,pointRadius:0}]},
      options:{plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:ch.xlabel}},y:{title:{display:true,text:ch.ylabel}}}}};
  }
  econCharts[id]=new Chart(ctx,cfg);
}

      ${levels.map(lv=>`<button class="book-tab ${lv===booksState.filter?"active":""}" onclick="setBookFilter('${lv}',this)">${lv}${lv!=="All"?` (${counts[lv]})`:` (${l.books.length})`}</button>`).join("")}
    </div>
    <div id="book-list" class="book-list"></div>
    <section class="block story-closing"><h2>Which book should you start with?</h2><p>${l.closing}</p></section>
    ${refsHTML(l, null)}
    ${navHTML(i)}`;
  drawBookList();
}
const LEVEL_CLASS={Beginner:"lv-beginner",Intermediate:"lv-intermediate",Advanced:"lv-advanced"};
function drawBookList(){
  const l=LESSONS.find(x=>x.slug==="books");
  const list=document.getElementById("book-list"); if(!list) return;
  const shown=l.books.map((b,idx)=>({...b,idx})).filter(b=>booksState.filter==="All"||b.level===booksState.filter);
  list.innerHTML=shown.map(b=>`
    <article class="book-card">
      <div class="book-num">${b.idx+1}</div>
      <div class="book-main">
        <div class="book-head"><h3 class="book-title">${b.title}</h3>
          <span class="book-level ${LEVEL_CLASS[b.level]}">${b.level}</span></div>
        <p class="book-author">${b.author}</p>
        <p class="book-note">${b.note}</p>
      </div>
      <a class="book-buy" href="${b.buy}" target="_blank" rel="noopener">${b.buy.includes("amazon.com/s")?"Find it →":"Get it →"}</a>
    </article>`).join("");
}
function setBookFilter(lv,btn){
  booksState.filter=lv;
  btn.parentElement.querySelectorAll(".book-tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  drawBookList();
}

// ==================== TREE OF LIFE (decision map) ====================
const TREE = {
  q:"What kind of outcome are you analysing?",
  options:[
    {label:"Categorical (counts / labels)", node:{
      q:"How many categorical variables?",
      options:[
        {label:"One — vs an expected distribution", leaf:"Chi-Square Goodness of Fit"},
        {label:"Two — are they related?", leaf:"Chi-Square Test of Independence"}
      ]}},
    {label:"Numeric — comparing means", node:{
      q:"How many groups?",
      options:[
        {label:"One group vs a known value", leaf:"One-Sample t-Test (or Z-Test if σ known)"},
        {label:"Two groups", node:{
          q:"Are the two groups paired?",
          options:[
            {label:"Paired (same subjects)", leaf:"Paired t-Test"},
            {label:"Independent groups", leaf:"Independent Two-Sample t-Test"}
          ]}},
        {label:"Three or more groups", leaf:"ANOVA (F-Test)"}
      ]}},
    {label:"Numeric — relationship between variables", node:{
      q:"What do you want to know?",
      options:[
        {label:"Strength/direction of association", leaf:"Correlation (Pearson / Spearman)"},
        {label:"Predict y from one x", leaf:"Simple Linear Regression"},
        {label:"Predict y from several x", leaf:"Multiple Linear Regression"},
        {label:"The relationship is curved", leaf:"Non-Linear Regression"}
      ]}},
    {label:"Data ordered over time", leaf:"Time Series Analysis (trend / seasonality / ARIMA)"}
  ]
};
let treePath = [];
function renderTree(l){
  const i = LESSONS.indexOf(l);
  document.getElementById("content").innerHTML = `
    <h1 class="lesson-title">${numTitle(i)}</h1>
    <p class="lesson-summary">${l.summary}</p>
    <section class="block">
      <p class="note">Answer the questions to find the right statistical test.</p>
      <div id="tree-box"></div>
      <button class="btn ghost" style="margin-top:14px" onclick="resetTree()">↺ Start over</button>
    </section>
    ${refsHTML(l)}
    ${navHTML(i)}`;
  treePath=[]; drawTreeNode(TREE);
}
function drawTreeNode(node){
  const box=document.getElementById("tree-box");
  const crumbs = treePath.length? `<p class="tree-crumbs">${treePath.join(" → ")}</p>`:"";
  box.innerHTML = crumbs + `<div class="tree-q">${node.q}</div>` +
    `<div class="tree-opts">` +
    node.options.map((o,idx)=>`<button class="btn tree-opt" data-idx="${idx}">${o.label}</button>`).join("") +
    `</div>`;
  box.querySelectorAll(".tree-opt").forEach(btn=>{
    btn.onclick=()=>{
      const o=node.options[parseInt(btn.dataset.idx,10)];
      treePath.push(o.label);
      if(o.leaf) drawTreeLeaf(o.leaf);
      else drawTreeNode(o.node);
    };
  });
}
function drawTreeLeaf(answer){
  const box=document.getElementById("tree-box");
  box.innerHTML = `<p class="tree-crumbs">${treePath.join(" → ")}</p>
    <div class="tree-leaf">✅ Recommended test:<br><span>${answer}</span></div>`;
}
function resetTree(){ treePath=[]; drawTreeNode(TREE); }

// ==================== CHARTS ====================
function drawChart(type){
  const ctx=document.getElementById("chart").getContext("2d");
  const note=document.getElementById("chart-note");
  const A="#4f46e5";
  const nPDF=(x,m,s)=>Math.exp(-((x-m)**2)/(2*s*s))/(s*Math.sqrt(2*Math.PI));
  const noLegend={plugins:{legend:{display:false}}};
  const line=(xt,yt)=>({scales:{x:{type:"linear",title:{display:true,text:xt}},y:{title:{display:true,text:yt}}},plugins:{legend:{display:false}}});

  if(type==="variables"){
    chartInstance=new Chart(ctx,{type:"doughnut",
      data:{labels:["Nominal","Ordinal","Interval","Ratio"],
        datasets:[{data:[25,25,25,25],backgroundColor:["#94a3b8","#60a5fa","#4f46e5","#22c55e"]}]},
      options:{plugins:{legend:{position:"bottom"}}}});
    note.textContent="The four levels of measurement, from labels (nominal) up to true-zero scales (ratio).";
  }
  else if(type==="descriptive"){
    const d=[2,3,4,5,6,8,8];
    chartInstance=new Chart(ctx,{type:"bar",
      data:{labels:d.map((_,i)=>"x"+(i+1)),datasets:[{data:d,backgroundColor:A}]},
      options:{...noLegend,scales:{y:{beginAtZero:true}}}});
    note.textContent="Sample values. Mean ≈ 5.14, median = 5, mode = 8, SD ≈ 2.27.";
  }
  else if(type==="sampling"){
    const nPDF2=(x,m,s)=>Math.exp(-((x-m)**2)/(2*s*s))/(s*Math.sqrt(2*Math.PI));
    const mu=50, sigma=10;
    const mk=(n,color)=>{const se=sigma/Math.sqrt(n),pts=[];
      for(let x=30;x<=70;x+=0.5)pts.push({x,y:nPDF2(x,mu,se)});
      return {label:`n = ${n} (SE = ${se.toFixed(2)})`,data:pts,borderColor:color,pointRadius:0,tension:.4,fill:false};};
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[mk(10,"#94a3b8"),mk(30,"#f59e0b"),mk(100,"#4f46e5")]},
      options:{scales:{x:{type:"linear",title:{display:true,text:"sample mean x̄"}},
        y:{title:{display:true,text:"density"}}},plugins:{legend:{position:"bottom"}}}});
    note.textContent="Sampling distribution of the mean (population μ=50, σ=10). As n grows, the curve gets taller and narrower — the sample mean becomes more precise (SE = σ/√n). This is the Central Limit Theorem in action.";
  }
  else if(type==="outliers"){
    const d=[10,12,12,13,14,15,40];
    chartInstance=new Chart(ctx,{type:"bar",
      data:{labels:d.map((v,i)=>i+1),datasets:[{data:d,
        backgroundColor:d.map(v=>v>19.5?"#ef4444":A)}]},
      options:{...noLegend,scales:{y:{beginAtZero:true}}}});
    note.textContent="Red bar (40) lies beyond the upper fence Q3+1.5×IQR = 19.5 — an outlier.";
  }
  else if(type==="normal"){
    const pts=[];for(let x=-4;x<=4;x+=0.1)pts.push({x,y:nPDF(x,0,1)});
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[{data:pts,borderColor:A,tension:.4,pointRadius:0,fill:true,backgroundColor:"rgba(79,70,229,.12)"}]},
      options:line("z-score (σ from mean)","density")});
    note.textContent="Bell curve: 68% within ±1σ, 95% within ±2σ, 99.7% within ±3σ.";
  }
  else if(type==="ttest"){
    const t=[],z=[];
    for(let x=-4;x<=4;x+=0.1){z.push({x,y:nPDF(x,0,1)});
      const df=3,c=0.368;t.push({x,y:c*Math.pow(1+x*x/df,-(df+1)/2)});}
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[
        {label:"Normal (z)",data:z,borderColor:"#94a3b8",pointRadius:0,tension:.4},
        {label:"t (df=3)",data:t,borderColor:A,pointRadius:0,tension:.4}]},
      options:{scales:{x:{type:"linear"}},plugins:{legend:{position:"bottom"}}}});
    note.textContent="The t-distribution (blue) has heavier tails than the normal (grey); they converge as df grows.";
  }
  else if(type==="ztest"){
    const pts=[];for(let x=-4;x<=4;x+=0.1)pts.push({x,y:nPDF(x,0,1)});
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[{data:pts,borderColor:A,tension:.4,pointRadius:0,fill:true,
        backgroundColor:(c)=>0,segment:{}}]},
      options:line("z","density")});
    note.textContent="Standard normal. Two-tailed rejection regions lie beyond ±1.96 at α = 0.05.";
  }
  else if(type==="ftest"){
    const pts=[];for(let x=0.05;x<=5;x+=0.05){const d1=5,d2=10;
      pts.push({x,y:Math.pow(x,d1/2-1)/Math.pow(1+d1*x/d2,(d1+d2)/2)});}
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[{data:pts,borderColor:A,tension:.3,pointRadius:0,fill:true,backgroundColor:"rgba(79,70,229,.1)"}]},
      options:line("F value","density")});
    note.textContent="An F-distribution (df=5,10): right-skewed and always positive. Large F → reject H₀.";
  }
  else if(type==="chisquare"){
    const pts=[];const k=5;
    for(let x=0.1;x<=16;x+=0.1){pts.push({x,y:Math.pow(x,k/2-1)*Math.exp(-x/2)});}
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[{data:pts,borderColor:A,tension:.3,pointRadius:0,fill:true,backgroundColor:"rgba(79,70,229,.1)"}]},
      options:line("χ² value","density")});
    note.textContent="Chi-square distribution (df=5), right-skewed. Critical value ≈ 11.07 at α = 0.05.";
  }
  else if(type==="hypothesis"){
    const pts=[];for(let x=-4;x<=4;x+=0.1)pts.push({x,y:nPDF(x,0,1)});
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[{data:pts,borderColor:A,tension:.4,pointRadius:0,fill:true,backgroundColor:"rgba(79,70,229,.12)"}]},
      options:line("test statistic","density")});
    note.textContent="The tails beyond the critical values are the rejection regions where p ≤ α.";
  }
  else if(type==="type-errors"){
    chartInstance=new Chart(ctx,{type:"bar",
      data:{labels:["Correct (H₀ true)","Type I (α)","Type II (β)","Power (1−β)"],
        datasets:[{data:[0.95,0.05,0.20,0.80],
          backgroundColor:["#22c55e","#ef4444","#f59e0b","#4f46e5"]}]},
      options:{...noLegend,scales:{y:{beginAtZero:true,max:1}}}});
    note.textContent="Illustrative rates: α = 0.05 (Type I), β = 0.20 (Type II), power = 0.80.";
  }
  else if(type==="correlation"){
    const pts=[];for(let i=0;i<40;i++){const x=Math.random()*10;
      pts.push({x,y:x*0.8+Math.random()*2});}
    chartInstance=new Chart(ctx,{type:"scatter",
      data:{datasets:[{data:pts,backgroundColor:A}]},
      options:line("study hours","exam score")});
    note.textContent="A strong positive correlation (r ≈ 0.8): points trend upward together.";
  }
  else if(type==="regression"){
    const pts=[],line1=[];
    for(let i=0;i<30;i++){const x=Math.random()*8;pts.push({x,y:30+5*x+(Math.random()*10-5)});}
    for(let x=0;x<=8;x+=0.5)line1.push({x,y:30+5*x});
    chartInstance=new Chart(ctx,{type:"scatter",
      data:{datasets:[
        {label:"data",data:pts,backgroundColor:"#94a3b8"},
        {label:"ŷ = 30 + 5x",data:line1,type:"line",borderColor:A,pointRadius:0,tension:0}]},
      options:{scales:{x:{type:"linear",title:{display:true,text:"study hours"}},
        y:{title:{display:true,text:"score"}}},plugins:{legend:{position:"bottom"}}}});
    note.textContent="Least-squares line ŷ = 30 + 5x fitted through the scattered data.";
  }
  else if(type==="nonlinear"){
    const pts=[];for(let x=0;x<=6;x+=0.25)pts.push({x,y:100*Math.pow(2,x)});
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[{label:"N = 100·2^t",data:pts,borderColor:A,tension:.3,pointRadius:0,fill:true,backgroundColor:"rgba(79,70,229,.1)"}]},
      options:line("time (h)","count")});
    note.textContent="Exponential growth: doubling each hour rises far faster than any straight line.";
  }
  else if(type==="multilinear"){
    chartInstance=new Chart(ctx,{type:"bar",
      data:{labels:["Intercept b₀","Study b₁","Sleep b₂"],
        datasets:[{data:[20,5,3],backgroundColor:["#94a3b8",A,"#22c55e"]}]},
      options:{...noLegend,scales:{y:{beginAtZero:true}}}});
    note.textContent="ŷ = 20 + 5·study + 3·sleep. Each bar is a coefficient's contribution.";
  }
  else if(type==="timeseries"){
    const pts=[];for(let t=0;t<=24;t++){
      pts.push({x:t, y:10 + 0.5*t + 3*Math.sin(t/2)});}
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[{data:pts,borderColor:A,tension:.3,pointRadius:2,fill:false}]},
      options:line("time","value")});
    note.textContent="Upward trend + repeating seasonal wave — the two core time-series components.";
  }
  else if(type==="pca"){
    // Scree plot: variance explained per component + cumulative line
    const varExp=[78,12,6,3,1];
    let cum=0; const cumLine=varExp.map(v=>({x:0,y:0}));
    const cumData=[]; let run=0; varExp.forEach((v,i)=>{run+=v; cumData.push(run);});
    chartInstance=new Chart(ctx,{
      data:{labels:["PC1","PC2","PC3","PC4","PC5"],
        datasets:[
          {type:"bar",label:"Variance explained (%)",data:varExp,backgroundColor:A,order:2},
          {type:"line",label:"Cumulative (%)",data:cumData,borderColor:"#f59e0b",backgroundColor:"#f59e0b",tension:.2,order:1,yAxisID:"y"}
        ]},
      options:{scales:{y:{beginAtZero:true,max:100,title:{display:true,text:"% variance"}}},
        plugins:{legend:{position:"bottom"}}}});
    note.textContent="Scree plot: PC1 alone explains 78% and PC1+PC2 reach 90% (orange line). The 'elbow' after PC2 means keeping 2 components captures almost everything — 5 variables reduced to 2.";
  }
  else if(type==="survey"){
    // Likert distribution as a bar chart (diverging colours)
    chartInstance=new Chart(ctx,{type:"bar",
      data:{labels:["1 ★ Strongly disagree","2 ★ Disagree","3 ★ Neutral","4 ★ Agree","5 ★ Strongly agree"],
        datasets:[{label:"Responses",data:[6,12,24,48,30],
          backgroundColor:["#dc2626","#f87171","#fbbf24","#4ade80","#16a34a"]}]},
      options:{...noLegend,indexAxis:"y",scales:{x:{beginAtZero:true,title:{display:true,text:"number of students"}}}}});
    note.textContent="Likert responses to 'well organised'. Green (agree/strongly agree) = 65% Top-2-box; red (disagree) = 15% — a real minority. The distribution shows what the mean (≈3.7) would hide.";
  }
}

showHome();
