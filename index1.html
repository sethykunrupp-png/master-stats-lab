.copy-btn{position:absolute;top:10px;right:10px;padding:5px 12px;font-size:.8rem;z-index:2}
.prompt-block{background:#fef3c7;color:#78350f;border:1px solid #fcd34d;border-radius:8px;
padding:16px;padding-top:40px;white-space:pre-wrap;font-family:inherit;font-size:.9rem;line-height:1.55;margin:0}

@media(max-width:800px){.layout{flex-direction:column}.sidebar{position:static;width:100%;flex:none;max-height:none}}

  slug:"variables", title:"1. Variables",
  summary:"The building blocks of data — what we measure and the forms it takes.",
  brief:"<b>Why:</b> Every analysis starts by knowing what type of data you have. <b>When:</b> Use this at the very start of any study, because the variable type decides which chart, summary, and test are even allowed. Averaging a category like 'blood type' is meaningless — so you classify first, analyse second.",
  theory:[
    ["What is a variable?","A <b>variable</b> is any characteristic that can take different values across people, objects, or time — height, income, colour, or a test score."],
    ["Quantitative vs Qualitative","<b>Quantitative</b> variables are numeric (age, weight). <b>Qualitative / categorical</b> variables are labels (gender, country, blood type)."],
    ["Discrete vs Continuous","Quantitative splits into <b>discrete</b> — countable whole numbers (number of children) — and <b>continuous</b> — any value on a scale (temperature, time)."],
    ["Levels of measurement","<b>Nominal</b> (labels, no order: colour). <b>Ordinal</b> (ordered, unequal gaps: rankings). <b>Interval</b> (ordered, equal gaps, no true zero: °C). <b>Ratio</b> (equal gaps + true zero: weight, income)."],
    ["Independent vs Dependent","The <b>independent</b> variable is what you change or group by; the <b>dependent</b> variable is the outcome you measure."]

  example:{problem:"Classify: (a) number of cars in a car park, (b) satisfaction rated 1–5, (c) body temperature in °C.",

  practice:[
    {problem:"Is 'postal code' quantitative or qualitative?",
     steps:["Postal codes are labels, not quantities — you don't average them.","So they are qualitative (nominal), even though they look like numbers."]},
    {problem:"Classify 'race finishing position (1st, 2nd, 3rd)'.",
     steps:["There is a clear order, but gaps between places aren't equal.","So it is qualitative-ordinal."]},

    {q:"The outcome you measure in an experiment is the… variable.",options:["Independent","Dependent","Control","Nominal"],answer:1},
    {q:"Temperature in °C is which level of measurement?",options:["Nominal","Ordinal","Interval","Ratio"],answer:2},
    {q:"Which is a continuous variable?",options:["Number of pets","Shoe size (whole)","Time to run 100m","Jersey number"],answer:2},

{
  slug:"descriptive", title:"2. Descriptive Statistics",
  summary:"Summarising data with centre and spread — mean, median, mode, variance, SD.",
  brief:"<b>Why:</b> Raw data is hard to read; a few numbers tell the story instantly. <b>When:</b> Use whenever you first explore a dataset — to report a typical value (centre) and how much values differ (spread) before any deeper test. It's the 'get to know your data' step everyone does first.",
  theory:[
    ["Purpose","<b>Descriptive statistics</b> condense a dataset into a few numbers and charts so you can see its shape at a glance."],
    ["Centre","<b>Mean</b> <code>x̄ = Σx/n</code> (sensitive to outliers). <b>Median</b> = middle sorted value (robust). <b>Mode</b> = most frequent value."],
    ["Spread","<b>Range</b> = max − min. <b>Variance</b> <code>s² = Σ(x−x̄)²/(n−1)</code>. <b>Standard deviation</b> <code>s = √s²</code>, in the same units as the data."],
    ["Quartiles & IQR","Data split into four parts by Q1, Q2 (median), Q3. The <b>interquartile range</b> <code>IQR = Q3 − Q1</code> covers the middle 50%."],
    ["Shape","<b>Skew</b> describes asymmetry; <b>kurtosis</b> describes tail heaviness. A boxplot shows centre, spread, and outliers together."]
  ],
  example:{problem:"For 4, 8, 6, 5, 3, 8, 2 find mean, median, mode and sample SD.",
    steps:["Sort: 2,3,4,5,6,8,8","Mean = 36/7 ≈ 5.14","Median = 5, Mode = 8","Deviations² sum = 30.86 → s² = 30.86/6 ≈ 5.14 → s ≈ 2.27"]},
  practice:[
    {problem:"Find the mean and median of 3, 7, 7, 2, 6.",

    {problem:"Find the range and IQR of 1, 3, 5, 7, 9, 11, 13, 15.",

    {problem:"Why report the median instead of the mean for house prices?",
     steps:["A few very expensive homes pull the mean upward.","The median (middle price) is not distorted by those extremes → more 'typical'."]}
  ],
  graph:"descriptive",
  quiz:[
    {q:"Which is most affected by an outlier?",options:["Median","Mode","Mean","IQR"],answer:2},
    {q:"IQR equals…",options:["Q3 − Q1","max − min","Q2 − Q1","Q3 + Q1"],answer:0},
    {q:"Standard deviation is measured in…",options:["Squared units","The same units as the data","No units","Percent"],answer:1},
    {q:"The middle 50% of data is covered by the…",options:["Range","IQR","Mean","Mode"],answer:1},
    {q:"For 2, 2, 4, 6, the mean is…",options:["2","3.5","4","6"],answer:1},
    {q:"A dataset where all values are equal has a standard deviation of…",options:["1","0","The mean","Undefined"],answer:1}

},
{
  slug:"outliers", title:"3. Outliers",
  summary:"Spotting unusual values with the IQR rule and z-scores.",
  brief:"<b>Why:</b> A single wrong or extreme value can wreck an average, a correlation, or a model. <b>When:</b> Check for outliers right after summarising, before running tests or fitting lines. Catching them early prevents misleading results — and sometimes the outlier itself is the key finding (fraud, a fault, a rare event).",
  theory:[
    ["What is an outlier?","An <b>outlier</b> is a value far from the rest of the data. It may be a genuine extreme, a measurement error, or a data-entry mistake."],
    ["IQR method","Compute Q1, Q3, IQR. Any value below <code>Q1 − 1.5×IQR</code> or above <code>Q3 + 1.5×IQR</code> is a suspected outlier."],
    ["Z-score method","For roughly normal data, values with <code>|z| > 3</code> (more than 3 SD from the mean) are treated as outliers."],
    ["What to do","Don't delete blindly. Investigate: fix errors, keep genuine extremes, and report results with and without them if they change conclusions."]
  ],
  example:{problem:"Data: 10, 12, 12, 13, 14, 15, 40. Is 40 an outlier by the IQR rule?",

  graph:"outliers",
  quiz:[

    {q:"By the z-score rule, an outlier usually has…",options:["|z| > 1","|z| > 2","|z| > 3","z = 0"],answer:2},
    {q:"The best first response to an outlier is to…",options:["Delete it","Investigate it","Ignore it","Double it"],answer:1},
    {q:"Outliers most strongly distort the…",options:["Median","Mean","Mode","IQR"],answer:1},
    {q:"The lower IQR fence is…",options:["Q1 − 1.5×IQR","Q1 + 1.5×IQR","Q3 − 1.5×IQR","min − IQR"],answer:0}
  ],
  references:[["NIST – Detection of Outliers","https://www.itl.nist.gov/div898/handbook/prc/section1/prc16.htm"]]

{
  slug:"normal", title:"4. Normal Distribution",
  summary:"The bell curve, z-scores, and the 68–95–99.7 rule.",
  brief:"<b>Why:</b> So many real measurements (heights, errors, test scores) pile up in a bell shape, and most classic tests assume it. <b>When:</b> Use the normal model to find probabilities ('what % score above 90?'), to standardise values with z-scores, and as the backbone of z-tests, confidence intervals, and much of inference.",
  theory:[
    ["The bell curve","The <b>normal distribution</b> is symmetric and bell-shaped, defined by mean μ and standard deviation σ. Many natural measurements follow it."],
    ["Empirical rule","~<b>68%</b> of data lie within 1σ, ~<b>95%</b> within 2σ, ~<b>99.7%</b> within 3σ of the mean."],
    ["Z-score","<code>z = (x − μ)/σ</code> — how many SDs a value sits from the mean. Lets you compare across different distributions."],
    ["Standard normal","μ = 0, σ = 1. Converting to z-scores standardises any normal distribution and lets you use z-tables."]
  ],
  example:{problem:"Scores are normal with μ=70, σ=8. Find the z-score for 86.",
    steps:["z = (86 − 70)/8 = 16/8 = 2","86 is 2 SD above the mean.","Only ~2.5% of scores exceed 2σ, so 86 is uncommonly high."]},
  practice:[

    {problem:"Student A scored z=1.2 on Test 1, B scored z=0.9 on Test 2. Who did relatively better?",

  ],
  graph:"normal",

{
  slug:"ttest", title:"5. T-Test",
  summary:"Comparing means when the population SD is unknown and samples are small.",
  brief:"<b>Why:</b> In real life you almost never know the population's true spread, and samples are often small — the t-test handles exactly that. <b>When:</b> Use it to compare a mean to a target, compare two groups (treatment vs control), or compare before/after on the same people. It's the everyday workhorse for comparing averages.",
  theory:[
    ["When to use","Use a <b>t-test</b> to compare means when the population standard deviation is unknown (the usual case) — especially with small samples."],
    ["Three types","<b>One-sample</b>: sample mean vs a known value. <b>Independent two-sample</b>: two separate groups. <b>Paired</b>: same subjects measured twice (before/after)."],

  example:{problem:"n=16, x̄=52, s=8, test H₀: μ=50 at α=0.05.",

  quiz:[

"variables":{
  intuition:"Think of a variable as a <i>question you can ask every subject</i> and get a different answer. 'How tall are you?' gives numbers; 'What is your nationality?' gives labels. The whole of statistics is just clever ways to summarise the pile of answers — but the <b>type</b> of answer decides which methods are legal. This is why we spend the first lecture here: choosing the wrong summary (say, the 'average nationality') is not a small error, it is meaningless.",
  formal:[
    ["Formal definition","A variable X is a function from the sample space of subjects Ω to a set of values V, i.e. X : Ω → V. When V ⊆ ℝ we call X <b>quantitative</b>; otherwise <b>categorical</b>."],
    ["Stevens' typology","S. S. Stevens (1946) defined four measurement scales by the transformations that preserve meaning: nominal (permutations of labels), ordinal (monotone increasing maps), interval (positive affine maps ax+b, a>0), ratio (positive scaling ax, a>0). The permitted statistics rise with the scale: mode → +median → +mean → +geometric mean/CV."],
    ["Why the true zero matters","Ratio scales have an absolute zero, so ratios are meaningful: 40 kg is twice 20 kg. Interval scales lack it: 40°C is <i>not</i> twice as hot as 20°C, because 0°C is a convention, not an absence of heat."]
  ],
  pitfalls:[
    "Treating coded categories as numbers — e.g. computing the mean of gender coded 1/2. The code is a label, not a quantity.",
    "Assuming Likert (1–5) gaps are equal. They are ordinal; the distance from 'agree' to 'strongly agree' need not equal 'neutral' to 'agree'. Many researchers still use means on them — know that this is a debated approximation.",
    "Confusing discrete with continuous when a count is large. 'Number of website visits' is discrete even if it reaches millions."
  ],
  exercises:[
    {level:"Easy",q:"Classify each: (a) ZIP code, (b) marathon finish time, (c) T-shirt size S/M/L, (d) number of siblings.",
     steps:["(a) Nominal — a label, not a magnitude.","(b) Ratio, continuous — true zero, any value.","(c) Ordinal — ordered categories, unequal gaps.","(d) Ratio, discrete — counted, true zero."]},
    {level:"Medium",q:"A researcher codes education as 1=primary, 2=secondary, 3=tertiary and reports a mean of 2.4. What is wrong, and what should they report?",
     steps:["Education here is ordinal; the numbers are ranks, not amounts.","A mean assumes equal spacing between levels, which is unjustified.","Report the median or the modal category, and the full frequency distribution."]},
    {level:"Hard",q:"Explain why temperature in Kelvin is ratio but in Celsius is interval, and give one statistic that is valid on Kelvin but misleading on Celsius.",
     steps:["Kelvin has an absolute zero (no molecular motion); Celsius zero is the freezing point of water, a convention.","On Kelvin, ratios are meaningful: 300 K is twice 150 K.","The coefficient of variation (SD/mean) is meaningful on Kelvin but changes arbitrarily on Celsius because the mean depends on the offset."]}
  ],
  refs:[

"descriptive":{
  intuition:"Every dataset is a cloud of numbers, and the human mind cannot hold a cloud. Descriptive statistics give the cloud a <b>centre of gravity</b> (mean/median) and a <b>width</b> (SD/IQR). If someone tells you only the average, you are half-blind: 'average water depth 1 m' drowned many people. Always pair a measure of centre with a measure of spread.",
  formal:[
    ["Mean as a balance point","The sample mean minimises squared distance: x̄ = argmin_c Σ(xᵢ − c)². The median minimises absolute distance: med = argmin_c Σ|xᵢ − c|. That single fact explains why the mean chases outliers and the median resists them."],
    ["Why n−1 (Bessel's correction)","Using x̄ (itself estimated from the data) instead of the true μ makes Σ(xᵢ−x̄)² systematically too small. Dividing by n−1 rather than n corrects the bias, giving E[s²] = σ². The '−1' is the one degree of freedom spent estimating the mean."],
    ["Standardisation","z = (x − x̄)/s re-expresses any value as 'number of SDs from the mean', making different variables comparable and feeding directly into the normal model and regression."]
  ],
  pitfalls:[
    "Reporting a mean for strongly skewed data (income, house prices) where the median is the honest 'typical' value.",
    "Forgetting units: variance is in squared units and is hard to interpret; the SD returns to original units — prefer it when communicating.",
    "Comparing SDs across variables with very different means. Use the coefficient of variation (CV = s/x̄) for a scale-free comparison."
  ],
  exercises:[
    {level:"Easy",q:"Data: 5, 5, 6, 8, 21. Find the mean and median. Which better represents the 'typical' value?",
     steps:["Mean = 45/5 = 9.","Median = 6 (middle of sorted 5,5,6,8,21).","The median (6) is more typical; the 21 inflates the mean."]},
    {level:"Medium",q:"Two classes both average 70. Class A has SD 3, Class B has SD 15. What does this tell a teacher?",
     steps:["Same centre, very different spread.","Class A is homogeneous — most students near 70.","Class B is diverse — many well below/above 70, so uniform teaching will misfit many; consider differentiated instruction."]},
    {level:"Hard",q:"Show numerically that adding a constant c to every value leaves the SD unchanged but shifts the mean by c. Use 2, 4, 6 with c = 10.",
     steps:["Original: mean = 4, deviations −2,0,2 → s² = 8/2 = 4, s = 2.","After +10: 12,14,16, mean = 14 (shifted by 10).","Deviations still −2,0,2 → s = 2 unchanged. Spread is translation-invariant; centre is not."]}
  ],
  refs:[

"outliers":{
  intuition:"An outlier is the data point that makes you say 'wait, what?'. It is not automatically bad — it may be the most important observation you have (the fraudulent transaction, the faulty batch, the record-breaking athlete). The skill is not deletion but <b>diagnosis</b>: is it an error to fix, or a real signal to explain?",
  formal:[
    ["Tukey's fences","John Tukey defined the fences Q1 − 1.5·IQR and Q3 + 1.5·IQR. For normal data these flag about 0.7% of points, so a handful of flags in large data is expected, not alarming. The multiplier 3 gives 'far out' values."],
    ["Z-score rule and its weakness","|z| > 3 flags outliers, but the mean and SD used to compute z are themselves inflated by the outlier (masking). Robust alternatives use the median and MAD: robust z = 0.6745·(x − median)/MAD."],
    ["Influence vs outlier","In regression, a point can be an outlier in y, in x (high leverage), or influential (changes the fitted line). Cook's distance measures influence — a large residual alone is not the whole story."]

  pitfalls:[

  refs:[
    ["NIST/SEMATECH e-Handbook – Outliers","https://www.itl.nist.gov/div898/handbook/prc/section1/prc16.htm"],

"normal":{
  intuition:"The bell curve is nature's favourite shape because of a deep reason: when many small independent effects add up, their sum tends to a normal — this is the Central Limit Theorem. Heights, measurement errors, exam totals are all 'sums of many little causes', so they cluster in a bell. Master the normal and you hold the key to most of inference.",
  formal:[
    ["The density","f(x) = (1/(σ√(2π))) · exp(−(x−μ)²/(2σ²)). It is symmetric about μ, with inflection points at μ±σ. μ sets the location, σ the width."],
    ["Central Limit Theorem","For i.i.d. X₁…Xₙ with mean μ and finite variance σ², the sample mean satisfies (X̄ₙ − μ)/(σ/√n) → N(0,1) as n → ∞. This is <i>why</i> the normal appears even when the data themselves aren't normal — and why sampling distributions of means are normal for large n."],
    ["Standardisation & z-tables","Any X ~ N(μ,σ²) becomes Z = (X−μ)/σ ~ N(0,1). Probabilities are areas: P(X ≤ x) = Φ((x−μ)/σ), where Φ is the standard normal CDF."]
  ],
  pitfalls:[
    "Assuming everything is normal. Income, waiting times, and city sizes are right-skewed; forcing a normal model misleads. Check with a histogram or Q–Q plot.",
    "Confusing 'the data are normal' with 'the sample mean is normal'. The CLT gives the second for large n even when the first is false.",
    "Reading the empirical rule as exact. 68/95/99.7 are rounded; exact tail areas need the z-table or software."
  ],
  exercises:[
    {level:"Easy",q:"Heights are N(170, 10²) cm. What z-score is 185 cm, and roughly what % are taller?",
     steps:["z = (185−170)/10 = 1.5.","P(Z > 1.5) ≈ 0.067 → about 6.7% are taller."]},
    {level:"Medium",q:"A test is N(500, 100²). Between which scores do the middle 95% of students fall?",
     steps:["Middle 95% ≈ μ ± 1.96σ.","500 ± 1.96×100 = 500 ± 196.","Approximately 304 to 696."]},
    {level:"Hard",q:"Daily returns of a stock are NOT normal (fat tails), yet the average of 250 daily returns is treated as normal. Justify using the CLT and state one caveat.",
     steps:["The mean of 250 i.i.d.-ish returns is approximately normal by the CLT, regardless of the per-day shape.","So inference on the mean return can use normal theory.","Caveat: returns are not fully independent (volatility clustering) and variance must be finite — heavy tails slow the convergence, so treat with care."]}
  ],
  refs:[
    ["OpenStax – The Normal Distribution","https://openstax.org/books/introductory-statistics/pages/6-introduction"],
    ["Seeing Theory – Central Limit Theorem (visual)","https://seeing-theory.brown.edu/probability-distributions/index.html"]
  ]
},

"ttest":{
  intuition:"The t-test answers 'is this difference in averages real, or could plain luck produce it?'. Because we don't know the true spread, we <b>estimate</b> it from the sample — and that extra uncertainty is exactly what William Gosset ('Student', 1908) baked into the t-distribution's fatter tails while working at Guinness. Small sample → more caution → fatter tails.",
  formal:[
    ["The statistic & its law","t = (x̄ − μ₀)/(s/√n). If the data are normal, t follows a Student's t-distribution with n−1 degrees of freedom. As df → ∞, t → N(0,1)."],
    ["Two-sample (pooled)","For equal variances, t = (x̄₁ − x̄₂)/(s_p·√(1/n₁+1/n₂)) with pooled s_p² = [(n₁−1)s₁²+(n₂−1)s₂²]/(n₁+n₂−2). Welch's t (unequal variances) is the safer default in practice."],
    ["Paired = one-sample on differences","A paired t-test computes dᵢ = beforeᵢ − afterᵢ and tests whether the mean difference is 0 — removing between-subject variation and boosting power."],
    ["Assumptions","Independence, approximate normality (or large n via CLT), and — for the pooled two-sample — equal variances. Effect size: Cohen's d = (x̄₁−x̄₂)/s_p."]
  ],
  pitfalls:[
    "Using an independent-samples t-test on paired data (e.g. before/after the same people) — this wastes the pairing and loses power.",
    "Reporting only p. A tiny, useless difference can be 'significant' with large n; always report Cohen's d and a confidence interval.",
    "Assuming equal variances without checking. Prefer Welch's t by default; it is robust and rarely worse."
  ],
  exercises:[
    {level:"Easy",q:"n=9, x̄=104, s=6, test H₀: μ=100. Compute t and its df.",
     steps:["SE = 6/√9 = 2.","t = (104−100)/2 = 2.0.","df = 9−1 = 8. Compare to critical t₀.₀₂₅,₈ ≈ 2.306 → just fails to reject at 5%."]},
    {level:"Medium",q:"A clinic measures blood pressure on 20 patients before and after a drug. Which test, and why is it more powerful than treating the two sets as independent?",
     steps:["Use a paired t-test on the within-patient differences.","Pairing removes between-patient variability (some people just run high).","With that noise gone, the standard error shrinks and the test detects smaller true effects."]},
    {level:"Hard",q:"Two groups: n₁=n₂=30, x̄₁=52, x̄₂=48, s₁=10, s₂=10. Estimate t (pooled) and Cohen's d, and interpret both.",
     steps:["s_p = 10; SE = 10·√(1/30+1/30) ≈ 2.58.","t = (52−48)/2.58 ≈ 1.55 → not significant at 5% (crit ≈ 2.0).","Cohen's d = 4/10 = 0.4 (a small-to-medium effect). The effect may be real but the sample lacks power to confirm it."]}
  ],
  refs:[
    ["Student (1908) 'The Probable Error of a Mean'","https://www.jstor.org/stable/2331554"],
    ["OpenStax – The t-Distribution","https://openstax.org/books/introductory-statistics/pages/8-introduction"]
  ]
},

"ztest":{
  intuition:"The z-test is the t-test's confident older sibling: it is used when you either know the population spread or have so much data that your estimate of it is essentially perfect. Its natural home today is <b>proportions</b> — conversion rates, pass rates, defect rates — where big samples are common and the normal approximation shines.",
  formal:[
    ["Mean, σ known","z = (x̄ − μ₀)/(σ/√n) ~ N(0,1) exactly under H₀ when data are normal, approximately otherwise by the CLT."],
    ["One proportion","z = (p̂ − p₀)/√(p₀(1−p₀)/n). Valid when np₀ and n(1−p₀) are both ≥ ~10 so the binomial is well-approximated by a normal."],
    ["Two proportions","z = (p̂₁ − p̂₂)/√(p̂(1−p̂)(1/n₁+1/n₂)) with pooled p̂ = (x₁+x₂)/(n₁+n₂). This underlies most A/B tests."],
    ["Critical values","Two-tailed α=0.05 → ±1.96; one-tailed → 1.645; α=0.01 two-tailed → ±2.576."]
  ],
  pitfalls:[
    "Using a z-test with small n and unknown σ — that is the t-test's job; z understates uncertainty and gives too-narrow intervals.",
    "Applying the normal approximation to proportions when successes or failures are few (rule of thumb <10) — use an exact binomial test instead.",
    "Peeking at an A/B test and stopping when it first hits significance — repeated looks inflate the false-positive rate; fix n or use sequential methods."
  ],
  exercises:[
    {level:"Easy",q:"σ=15, n=100, x̄=103, test H₀: μ=100 (two-tailed, α=0.05).",
     steps:["SE = 15/10 = 1.5.","z = 3/1.5 = 2.0.","|2.0| > 1.96 → reject H₀."]},
    {level:"Medium",q:"A landing page converts 120 of 2000 visitors (6%). The old page converted 5%. Is 6% significantly higher (one-tailed)?",
     steps:["p̂ = 0.06, p₀ = 0.05; SE = √(0.05·0.95/2000) ≈ 0.00487.","z = (0.06−0.05)/0.00487 ≈ 2.05.","2.05 > 1.645 → yes, significant at 5% one-tailed."]},
    {level:"Hard",q:"A/B test: A 200/4000, B 240/4000. Test the difference in conversion (two-tailed).",
     steps:["p̂_A = 0.05, p̂_B = 0.06; pooled p̂ = 440/8000 = 0.055.","SE = √(0.055·0.945·(1/4000+1/4000)) ≈ 0.00509.","z = (0.06−0.05)/0.00509 ≈ 1.96 → right at the 5% boundary; treat as borderline and gather more data."]}
  ],
  refs:[
    ["Khan Academy – Significance tests (z)","https://www.khanacademy.org/math/statistics-probability/significance-tests-one-sample"],
    ["Kohavi et al. – Trustworthy Online Controlled Experiments","https://experimentguide.com/"]
  ]
},

"ftest":{
  intuition:"When you compare three or more groups, running many t-tests is like buying many lottery tickets for a false positive — each test carries its own 5% risk and they accumulate. ANOVA asks one global question instead: 'is the spread <b>between</b> group means larger than the spread <b>within</b> groups?' If yes, at least one group truly differs. The F-ratio is that between/within comparison.",
  formal:[
    ["Variance partition","Total SS = Between SS + Within SS. Dividing each by its df gives mean squares: MS_between (df = k−1) and MS_within (df = N−k)."],
    ["The F-statistic","F = MS_between / MS_within. Under H₀ (all means equal) F follows an F-distribution with (k−1, N−k) df; large F → reject."],
    ["Multiple-comparison problem","With k groups there are k(k−1)/2 pairwise tests; the family-wise error inflates. ANOVA controls it with one test, and post-hoc procedures (Tukey HSD, Bonferroni) then locate the differing pairs while holding error in check."],
    ["Assumptions","Independent samples, approximate normality of residuals, and homogeneity of variance (Levene's test). Effect size: η² = Between SS / Total SS."]
  ],
  pitfalls:[
    "Concluding 'which group is best' straight from a significant ANOVA — it only says at least one differs; you need a post-hoc test.",
    "Ignoring unequal variances; with very different spreads use Welch's ANOVA.",
    "Running many t-tests instead of ANOVA and not correcting α — the false-positive rate balloons with the number of comparisons."
  ],
  exercises:[
    {level:"Easy",q:"MS_between = 50, MS_within = 10. Compute F and state what a large F implies.",
     steps:["F = 50/10 = 5.0.","Between-group variation is 5× the within-group noise.","A large F is evidence that at least one group mean differs."]},
    {level:"Medium",q:"Three teaching methods, n=10 each. Why is one ANOVA better than three t-tests at α=0.05?",
     steps:["Three t-tests give roughly 1−(0.95)³ ≈ 14% chance of a false positive.","ANOVA tests all three simultaneously at a true 5% level.","It controls the family-wise error, then Tukey HSD identifies the specific differences."]},
    {level:"Hard",q:"An ANOVA gives F(2,27)=6.4, p=0.005, η²=0.32. Interpret significance AND practical importance, and state the next step.",
     steps:["p=0.005 < 0.05 → reject H₀; the group means are not all equal.","η²=0.32 → about 32% of the variance in the outcome is explained by group — a large effect.","Next: run Tukey HSD to find which specific pairs of groups differ."]}
  ],
  refs:[
    ["OpenStax – F Distribution and One-Way ANOVA","https://openstax.org/books/introductory-statistics/pages/13-introduction"],
    ["Fisher (1925) Statistical Methods for Research Workers","https://en.wikipedia.org/wiki/Statistical_Methods_for_Research_Workers"]
  ]
},

"chisquare":{
  intuition:"Chi-square is the test for <b>counts in boxes</b>. You have a table of how often each category occurred, and a theory of how often it <i>should</i> occur. Chi-square measures the total gap between observed and expected: small gap → theory holds; big gap → something real is going on. It powers 'is this die fair?' and 'are these two traits related?'.",
  formal:[
    ["The statistic","χ² = Σ (Oᵢ − Eᵢ)²/Eᵢ. Each term is a squared, scaled surprise; summing them gives an overall discrepancy that follows a χ² distribution under H₀."],
    ["Goodness of fit","Tests one categorical variable against an expected distribution; df = k − 1 (minus extra parameters estimated)."],
    ["Independence","In an r×c contingency table, Eᵢⱼ = (rowᵢ total × colⱼ total)/grand total; df = (r−1)(c−1). H₀ is that the two variables are independent."],
    ["Conditions","Expected counts should be ≥ 5 in most cells; for 2×2 tables with small counts use Fisher's exact test. Cramér's V measures association strength."]
  ],
  pitfalls:[
    "Running chi-square on percentages or means — it requires raw counts.",
    "Small expected counts (<5) invalidate the approximation; combine categories or use Fisher's exact test.",
    "A significant χ² says the variables are associated, not how strongly — report Cramér's V for effect size."
  ],
  exercises:[
    {level:"Easy",q:"A spinner (4 equal colours) spun 80 times gives 28,18,16,18. Compute χ² (E=20 each) and df.",
     steps:["Terms: (28−20)²/20=3.2, (18−20)²/20=0.2, (16−20)²/20=0.8, (18−20)²/20=0.2.","χ² = 3.2+0.2+0.8+0.2 = 4.4.","df = k−1 = 3; crit ≈ 7.81 → fail to reject: consistent with a fair spinner."]},
    {level:"Medium",q:"In a 2×2 table of (smoker/non-smoker) × (cough/no cough), one expected cell is 3.5. What should you do?",
     steps:["An expected count below 5 breaks the χ² approximation for a 2×2 table.","Use Fisher's exact test instead, which is valid for small counts.","Report the exact p-value and, if desired, the odds ratio for effect size."]},
    {level:"Hard",q:"A 3×3 independence test gives χ²=20.1. Find df, compare to the 5% critical value, and explain what rejecting means and what it does NOT tell you.",
     steps:["df = (r−1)(c−1) = (3−1)(3−1) = 4.","Critical χ²₀.₀₅,₄ ≈ 9.49.","χ²=20.1 ≫ 9.49 → reject independence: the two variables ARE associated. It does not tell you the direction or strength — compute Cramér's V and inspect the standardised residuals to see which cells drive the effect."]}
  ],
  refs:[
    ["OpenStax – The Chi-Square Distribution","https://openstax.org/books/introductory-statistics/pages/11-introduction"],
    ["Pearson (1900) original chi-square paper","https://www.tandfonline.com/doi/abs/10.1080/14786440009463897"]
  ]
}

const TEACH2 = {

"hypothesis":{
  intuition:"Hypothesis testing is the courtroom of statistics. The null hypothesis is 'innocent until proven guilty'; the data are the evidence; the p-value is 'how surprising is this evidence if the accused were innocent?'. We never <i>prove</i> innocence — we either find enough evidence to convict (reject H₀) or we don't (fail to reject). That asymmetry is the whole philosophy.",
  formal:[
    ["The logic","Assume H₀. Compute a test statistic and its p-value = P(data this extreme or more | H₀ true). If p ≤ α, the data are too surprising under H₀, so we reject it."],
    ["What p is NOT","p is not P(H₀ true), and (1−p) is not P(H₁ true). It is a statement about data given a hypothesis, not about a hypothesis given data — a Bayesian question that needs priors."],
    ["One- vs two-tailed","Two-tailed tests a difference in either direction (μ ≠ μ₀); one-tailed tests a specific direction (μ > μ₀). Choose the tail <i>before</i> seeing the data."],
    ["Confidence-interval duality","A two-sided α-level test rejects H₀: μ=μ₀ exactly when the (1−α) confidence interval excludes μ₀. Report the interval — it shows the effect size, not just a yes/no."]
  ],
  pitfalls:[
    "p-hacking: trying many tests/subgroups and reporting the significant ones. This manufactures false positives; pre-register hypotheses.",
    "Reading 'fail to reject' as 'H₀ is true'. Absence of evidence is not evidence of absence — the test may simply lack power.",
    "Confusing statistical significance with practical importance. With huge n, trivial effects become significant; always report effect size and CI."
  ],
  exercises:[
    {level:"Easy",q:"A two-tailed test returns p = 0.03 with α = 0.05. State the decision and interpret p in words.",
     steps:["0.03 ≤ 0.05 → reject H₀.","p means: if H₀ were true, data this extreme would occur only 3% of the time.","That is surprising enough (below 5%) to doubt H₀."]},
    {level:"Medium",q:"A drug trial (n=10) finds a promising mean improvement but p = 0.20. A journalist writes 'the drug does not work'. Why is that wrong?",
     steps:["p = 0.20 means we failed to reject H₀, not that H₀ is true.","With only n=10 the test has low power; a real effect could be missed.","Correct statement: the trial was inconclusive; a larger study is needed."]},
    {level:"Hard",q:"With n = 1,000,000 a difference of 0.1 points on a 100-point scale gives p < 0.001. Discuss significance vs importance and what to report.",
     steps:["The p-value is tiny because huge n shrinks the standard error, detecting even trivial effects.","A 0.1-point difference is practically meaningless in most contexts.","Report the effect size and confidence interval, and judge importance on the scale of the problem — not on p alone."]}
  ],
  refs:[
    ["Wasserstein & Lazar (2016) ASA Statement on p-values","https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108"],
    ["OpenStax – Hypothesis Testing","https://openstax.org/books/introductory-statistics/pages/9-introduction"]
  ]
},

"type-errors":{
  intuition:"Every test faces two ways to be wrong, and they trade off like a smoke detector's sensitivity. Set it too sensitive and it shrieks at toast (Type I, false alarm); set it too dull and it misses a real fire (Type II, missed detection). You cannot drive both to zero at once with fixed data — but a bigger sample lets you lower both. 'Power' is the detector's ability to catch a real fire.",
  formal:[
    ["The 2×2 of truth","Rows = decision (reject / not), columns = reality (H₀ true / false). α = P(reject | H₀ true) = Type I. β = P(fail to reject | H₀ false) = Type II. Power = 1 − β."],
    ["What drives power","Power rises with (i) larger true effect size, (ii) larger n, (iii) smaller σ, and (iv) larger α. The four are linked — fix any three and the fourth is determined (power analysis)."],
    ["Sample-size planning","To detect effect d with power 1−β at level α, solve for n. For a two-sided one-sample z: n ≈ ((z_{α/2}+z_β)/d)². This is done <i>before</i> collecting data."],
    ["Multiple testing","Running m tests at α inflates the family-wise Type I rate to ≈ 1−(1−α)^m. Corrections: Bonferroni (α/m) or FDR control (Benjamini–Hochberg)."]
  ],
  pitfalls:[
    "Chasing α → 0 to look rigorous; this quietly raises β and kills power to detect real effects.",
    "Running an underpowered study, getting p > 0.05, and declaring 'no effect' — a classic Type II mistake.",
    "Doing many comparisons without correction; some 'findings' are just the false-positive rate at work."
  ],
  exercises:[
    {level:"Easy",q:"A pregnancy test says 'not pregnant' to a woman who is pregnant. Name the error and give its probability symbol.",
     steps:["H₀ = 'not pregnant'; reality = pregnant (H₀ false).","Failing to reject a false H₀ → Type II error.","Its probability is β."]},
    {level:"Medium",q:"A study has power 0.5 to detect a real effect. What does that mean practically, and how would you raise it?",
     steps:["Even if the effect is real, the study has only a 50% chance of detecting it — a coin flip.","Half of such studies would wrongly conclude 'no effect'.","Raise power by increasing n, reducing measurement noise, or (if justified) using a larger α or one-tailed test."]},
    {level:"Hard",q:"You will run 20 independent tests at α = 0.05 with all nulls true. Expected number of false positives? Give a correction.",
     steps:["Expected false positives = 20 × 0.05 = 1.","P(at least one) = 1 − 0.95²⁰ ≈ 0.64 — very likely.","Bonferroni: test each at α/20 = 0.0025, or control the false discovery rate with Benjamini–Hochberg for more power."]}
  ],
  refs:[
    ["Cohen (1988) Statistical Power Analysis","https://www.taylorfrancis.com/books/mono/10.4324/9780203771587/statistical-power-analysis-behavioral-sciences-jacob-cohen"],
    ["Benjamini & Hochberg (1995) FDR","https://www.jstor.org/stable/2346101"]
  ]
},

"correlation":{
  intuition:"Correlation is a single number that captures 'do these two things rise and fall together?'. Picture a scatter of points: if they hug an upward line, r is near +1; a downward line, near −1; a shapeless blob, near 0. The classic warning — correlation is not causation — is the most important sentence in applied statistics: ice-cream sales and drownings correlate because summer drives both.",
  formal:[
    ["Pearson's r","r = Σ(xᵢ−x̄)(yᵢ−ȳ) / √[Σ(xᵢ−x̄)²·Σ(yᵢ−ȳ)²] = cov(x,y)/(s_x s_y). It measures <i>linear</i> association only, bounded in [−1, 1]."],
    ["Coefficient of determination","r² is the share of variance in one variable linearly explained by the other, and equals the R² of the simple regression of y on x."],
    ["Spearman & Kendall","For monotonic-but-curved or ordinal data, rank correlations (Spearman's ρ, Kendall's τ) replace Pearson and are robust to outliers."],
    ["Inference","Test H₀: population ρ = 0 with t = r·√((n−2)/(1−r²)), df = n−2. Significance depends heavily on n."]
  ],
  pitfalls:[
    "Reading causation into correlation. A lurking (confounding) variable or reverse causation may explain it — only a controlled design supports causal claims.",
    "Trusting a low Pearson r as 'no relationship' — it may be strongly curved (e.g. U-shaped) with r ≈ 0. Always plot.",
    "Anscombe's quartet: four datasets with identical r yet wildly different shapes. Never summarise a relationship by r alone."
  ],
  exercises:[
    {level:"Easy",q:"A scatter of hours vs score hugs a rising straight line. Estimate the sign of r and what r² near 0.9 would mean.",
     steps:["Rising line → positive r, close to +1.","r² ≈ 0.9 means ~90% of the variation in score is linearly explained by hours.","Strong linear association — but still not proof that hours cause the score."]},
    {level:"Medium",q:"Country data shows chocolate consumption correlates with Nobel prizes (r ≈ 0.79). Give two non-causal explanations.",
     steps:["Confounding: national wealth raises both chocolate spending and research funding.","It is an ecological correlation (countries, not people) — it need not hold for individuals.","Conclusion: a strong r here does not mean chocolate causes Nobels."]},
    {level:"Hard",q:"Data follow y = x² for x in [−3, 3]. Explain why Pearson r ≈ 0 despite a perfect relationship, and what to use instead.",
     steps:["The relationship is symmetric: rising for x>0, falling for x<0, so linear covariance cancels to ~0.","Pearson only detects <i>linear</i> association, so r ≈ 0 here.","Use a non-linear model, or a correlation on a transformed variable (e.g. correlate y with x²), or measures like distance correlation."]}
  ],
  refs:[
    ["Anscombe (1973) 'Graphs in Statistical Analysis'","https://www.tandfonline.com/doi/abs/10.1080/00031305.1973.10478966"],
    ["OpenStax – Correlation and Regression","https://openstax.org/books/introductory-statistics/pages/12-introduction"]
  ]
},

"regression":{
  intuition:"If correlation says 'these move together', regression draws the <b>best line</b> through the cloud so you can predict one from the other and read off 'how much y changes per unit x'. The line is chosen to make the total (squared) miss as small as possible. It is the workhorse of forecasting, economics, and machine learning's simplest model.",
  formal:[
    ["The model","yᵢ = β₀ + β₁xᵢ + εᵢ, with errors εᵢ assumed independent, mean-zero, constant-variance (homoscedastic), and (for inference) normal."],
    ["Least-squares estimates","β̂₁ = Σ(xᵢ−x̄)(yᵢ−ȳ)/Σ(xᵢ−x̄)² = r·(s_y/s_x); β̂₀ = ȳ − β̂₁x̄. These minimise Σ(yᵢ−ŷᵢ)²."],
    ["Fit & inference","R² = 1 − SS_res/SS_tot is the variance explained. Each coefficient has a standard error, giving a t-test (H₀: β=0) and a confidence interval."],
    ["Diagnostics","Check residuals: a plot vs fitted should be a patternless band. Curvature → wrong functional form; a funnel → heteroscedasticity; outliers/leverage → influential points (Cook's distance)."]
  ],
  pitfalls:[
    "Extrapolating beyond the data range — the linear pattern may not hold there.",
    "Ignoring residual diagnostics; a high R² can still hide curvature or heteroscedasticity that invalidate the standard errors.",
    "Interpreting β₀ (intercept) when x = 0 is outside the data or physically meaningless."
  ],
  exercises:[
    {level:"Easy",q:"Given r = 0.6, s_y = 8, s_x = 4, find the slope β̂₁ and interpret it.",
     steps:["β̂₁ = r·(s_y/s_x) = 0.6×(8/4) = 1.2.","Each 1-unit rise in x is associated with a 1.2-unit rise in predicted y."]},
    {level:"Medium",q:"A regression of house price on size gives R²=0.55. A colleague says 'size determines 55% of a house's price'. Correct the wording.",
     steps:["R² is the share of price <i>variance</i> linearly explained by size, not a share of the price level.","And 'explained' is statistical, not causal.","Better: 'size accounts for about 55% of the variation in prices in this sample; other factors explain the rest.'"]},
    {level:"Hard",q:"Residuals vs fitted show a clear U-shape. What assumption is violated, what does it invalidate, and how do you fix it?",
     steps:["A U-shape means the true relationship is non-linear — the linearity assumption fails.","The slope, R², and its p-values are then misleading.","Fix by adding a quadratic term (x²), transforming a variable (log), or fitting a non-linear model; re-check residuals afterward."]}
  ],
  refs:[

    ["Gelman & Hill – Regression and Multilevel Models","http://www.stat.columbia.edu/~gelman/arm/"]
  ]
},

function buildJokes(){
  const out = JOKE_SEEDS.slice();
  const extra = [
    "the mean","the median","the mode","the variance","the p-value",
    "the null hypothesis","the confidence interval","the regression line",
    "the standard deviation","the correlation","the sample size","the outlier",
    "the bell curve","the t-test","the chi-square","the residual",
    "the random variable","the trend line","the error term","the histogram"
  ];
  const templates = [
    a=>`Why did ${a} go to therapy? It couldn't handle the rejection region.`,
    a=>`${a.charAt(0).toUpperCase()+a.slice(1)} walked into a bar and immediately dropped the p-value.`,
    a=>`I asked ${a} out. It said the result was not statistically significant.`,
    a=>`${a.charAt(0).toUpperCase()+a.slice(1)} and I broke up — too much unexplained variance.`,
    a=>`My professor loves ${a}. It's the only thing that never fails to reject.`
  ];
  let i = 0;
  while(out.length < 100){
    const a = extra[i % extra.length];
    const t = templates[Math.floor(i / extra.length) % templates.length];
    out.push(t(a));
    i++;
  }
  return out.slice(0,100);
}

}

  box.innerHTML = crumbs + `<div class="tree-q">${node.q}</div>` +
    `<div class="tree-opts">` +
    node.options.map((o,idx)=>`<button class="btn tree-opt" data-idx="${idx}">${o.label}</button>`).join("") +
    `</div>`;
  box.querySelectorAll(".tree-opt").forEach(btn=>{
    btn.onclick=()=>{
      const o=node.options[parseInt(btn.dataset.idx,10)];
      treePath.push(o.label);
      if(o.leaf) drawTreeLeaf(o.leaf);
      else drawTreeNode(o.node);
    };
  });
}
function drawTreeLeaf(answer){
  const box=document.getElementById("tree-box");
  box.innerHTML = `<p class="tree-crumbs">${treePath.join(" → ")}</p>
    <div class="tree-leaf">✅ Recommended test:<br><span>${answer}</span></div>`;
}
function resetTree(){ treePath=[]; drawTreeNode(TREE); }

// ==================== CHARTS ====================
function drawChart(type){
  const ctx=document.getElementById("chart").getContext("2d");
  const note=document.getElementById("chart-note");
  const A="#4f46e5";
  const nPDF=(x,m,s)=>Math.exp(-((x-m)**2)/(2*s*s))/(s*Math.sqrt(2*Math.PI));
  const noLegend={plugins:{legend:{display:false}}};
  const line=(xt,yt)=>({scales:{x:{type:"linear",title:{display:true,text:xt}},y:{title:{display:true,text:yt}}},plugins:{legend:{display:false}}});

  if(type==="variables"){
    chartInstance=new Chart(ctx,{type:"doughnut",
      data:{labels:["Nominal","Ordinal","Interval","Ratio"],
        datasets:[{data:[25,25,25,25],backgroundColor:["#94a3b8","#60a5fa","#4f46e5","#22c55e"]}]},
      options:{plugins:{legend:{position:"bottom"}}}});
    note.textContent="The four levels of measurement, from labels (nominal) up to true-zero scales (ratio).";
  }
  else if(type==="descriptive"){
    const d=[2,3,4,5,6,8,8];
    chartInstance=new Chart(ctx,{type:"bar",
      data:{labels:d.map((_,i)=>"x"+(i+1)),datasets:[{data:d,backgroundColor:A}]},
      options:{...noLegend,scales:{y:{beginAtZero:true}}}});
    note.textContent="Sample values. Mean ≈ 5.14, median = 5, mode = 8, SD ≈ 2.27.";
  }
  else if(type==="outliers"){
    const d=[10,12,12,13,14,15,40];
    chartInstance=new Chart(ctx,{type:"bar",
      data:{labels:d.map((v,i)=>i+1),datasets:[{data:d,
        backgroundColor:d.map(v=>v>19.5?"#ef4444":A)}]},
      options:{...noLegend,scales:{y:{beginAtZero:true}}}});
    note.textContent="Red bar (40) lies beyond the upper fence Q3+1.5×IQR = 19.5 — an outlier.";
  }
  else if(type==="normal"){
    const pts=[];for(let x=-4;x<=4;x+=0.1)pts.push({x,y:nPDF(x,0,1)});
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[{data:pts,borderColor:A,tension:.4,pointRadius:0,fill:true,backgroundColor:"rgba(79,70,229,.12)"}]},
      options:line("z-score (σ from mean)","density")});
    note.textContent="Bell curve: 68% within ±1σ, 95% within ±2σ, 99.7% within ±3σ.";
  }
  else if(type==="ttest"){
    const t=[],z=[];
    for(let x=-4;x<=4;x+=0.1){z.push({x,y:nPDF(x,0,1)});
      const df=3,c=0.368;t.push({x,y:c*Math.pow(1+x*x/df,-(df+1)/2)});}
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[
        {label:"Normal (z)",data:z,borderColor:"#94a3b8",pointRadius:0,tension:.4},
        {label:"t (df=3)",data:t,borderColor:A,pointRadius:0,tension:.4}]},
      options:{scales:{x:{type:"linear"}},plugins:{legend:{position:"bottom"}}}});
    note.textContent="The t-distribution (blue) has heavier tails than the normal (grey); they converge as df grows.";
  }
  else if(type==="ztest"){
    const pts=[];for(let x=-4;x<=4;x+=0.1)pts.push({x,y:nPDF(x,0,1)});
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[{data:pts,borderColor:A,tension:.4,pointRadius:0,fill:true,
        backgroundColor:(c)=>0,segment:{}}]},
      options:line("z","density")});
    note.textContent="Standard normal. Two-tailed rejection regions lie beyond ±1.96 at α = 0.05.";
  }
  else if(type==="ftest"){
    const pts=[];for(let x=0.05;x<=5;x+=0.05){const d1=5,d2=10;
      pts.push({x,y:Math.pow(x,d1/2-1)/Math.pow(1+d1*x/d2,(d1+d2)/2)});}
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[{data:pts,borderColor:A,tension:.3,pointRadius:0,fill:true,backgroundColor:"rgba(79,70,229,.1)"}]},
      options:line("F value","density")});
    note.textContent="An F-distribution (df=5,10): right-skewed and always positive. Large F → reject H₀.";
  }
  else if(type==="chisquare"){
    const pts=[];const k=5;
    for(let x=0.1;x<=16;x+=0.1){pts.push({x,y:Math.pow(x,k/2-1)*Math.exp(-x/2)});}
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[{data:pts,borderColor:A,tension:.3,pointRadius:0,fill:true,backgroundColor:"rgba(79,70,229,.1)"}]},
      options:line("χ² value","density")});
    note.textContent="Chi-square distribution (df=5), right-skewed. Critical value ≈ 11.07 at α = 0.05.";
  }
  else if(type==="hypothesis"){
    const pts=[];for(let x=-4;x<=4;x+=0.1)pts.push({x,y:nPDF(x,0,1)});
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[{data:pts,borderColor:A,tension:.4,pointRadius:0,fill:true,backgroundColor:"rgba(79,70,229,.12)"}]},
      options:line("test statistic","density")});
    note.textContent="The tails beyond the critical values are the rejection regions where p ≤ α.";
  }
  else if(type==="type-errors"){
    chartInstance=new Chart(ctx,{type:"bar",
      data:{labels:["Correct (H₀ true)","Type I (α)","Type II (β)","Power (1−β)"],
        datasets:[{data:[0.95,0.05,0.20,0.80],
          backgroundColor:["#22c55e","#ef4444","#f59e0b","#4f46e5"]}]},
      options:{...noLegend,scales:{y:{beginAtZero:true,max:1}}}});
    note.textContent="Illustrative rates: α = 0.05 (Type I), β = 0.20 (Type II), power = 0.80.";
  }
  else if(type==="correlation"){
    const pts=[];for(let i=0;i<40;i++){const x=Math.random()*10;
      pts.push({x,y:x*0.8+Math.random()*2});}
    chartInstance=new Chart(ctx,{type:"scatter",
      data:{datasets:[{data:pts,backgroundColor:A}]},
      options:line("study hours","exam score")});
    note.textContent="A strong positive correlation (r ≈ 0.8): points trend upward together.";
  }
  else if(type==="regression"){
    const pts=[],line1=[];
    for(let i=0;i<30;i++){const x=Math.random()*8;pts.push({x,y:30+5*x+(Math.random()*10-5)});}
    for(let x=0;x<=8;x+=0.5)line1.push({x,y:30+5*x});
    chartInstance=new Chart(ctx,{type:"scatter",
      data:{datasets:[
        {label:"data",data:pts,backgroundColor:"#94a3b8"},
        {label:"ŷ = 30 + 5x",data:line1,type:"line",borderColor:A,pointRadius:0,tension:0}]},
      options:{scales:{x:{type:"linear",title:{display:true,text:"study hours"}},
        y:{title:{display:true,text:"score"}}},plugins:{legend:{position:"bottom"}}}});
    note.textContent="Least-squares line ŷ = 30 + 5x fitted through the scattered data.";
  }
  else if(type==="nonlinear"){
    const pts=[];for(let x=0;x<=6;x+=0.25)pts.push({x,y:100*Math.pow(2,x)});
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[{label:"N = 100·2^t",data:pts,borderColor:A,tension:.3,pointRadius:0,fill:true,backgroundColor:"rgba(79,70,229,.1)"}]},
      options:line("time (h)","count")});
    note.textContent="Exponential growth: doubling each hour rises far faster than any straight line.";
  }
  else if(type==="multilinear"){
    chartInstance=new Chart(ctx,{type:"bar",
      data:{labels:["Intercept b₀","Study b₁","Sleep b₂"],
        datasets:[{data:[20,5,3],backgroundColor:["#94a3b8",A,"#22c55e"]}]},
      options:{...noLegend,scales:{y:{beginAtZero:true}}}});
    note.textContent="ŷ = 20 + 5·study + 3·sleep. Each bar is a coefficient's contribution.";
  }
  else if(type==="timeseries"){
    const pts=[];for(let t=0;t<=24;t++){
      pts.push({x:t, y:10 + 0.5*t + 3*Math.sin(t/2)});}
    chartInstance=new Chart(ctx,{type:"line",
      data:{datasets:[{data:pts,borderColor:A,tension:.3,pointRadius:2,fill:false}]},
      options:line("time","value")});
    note.textContent="Upward trend + repeating seasonal wave — the two core time-series components.";
  }
}

showHome();
